<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點光源 2D 投影與物影關係模擬</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .canvas-cursor-grab {
            cursor: grab;
        }
        .canvas-cursor-grabbing {
            cursor: grabbing;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="w-screen h-screen overflow-hidden">

    <!-- Compact interaction controls -->
    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-10 w-[calc(100%-2rem)] max-w-2xl glass-card rounded-2xl p-3 flex flex-wrap items-center justify-center gap-2 shadow-2xl">
        <div class="grid grid-cols-2 gap-1.5 min-w-[170px]" aria-label="操作模式">
            <button id="btn-translate" class="flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl bg-sky-600 text-white font-semibold text-xs transition-all duration-200 shadow-md shadow-sky-600/30">
                <i data-lucide="move" class="w-3.5 h-3.5"></i>
                <span>平移</span>
            </button>
            <button id="btn-rotate" class="flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 font-medium text-xs transition-all duration-200 border border-slate-700 hover:bg-slate-700">
                <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                <span>Y軸旋轉</span>
            </button>
        </div>

        <label class="sr-only" for="shape-select">選擇物體</label>
        <select id="shape-select" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-2.5 py-1.5 outline-none focus:border-sky-500 transition-colors cursor-pointer">
            <option value="cube">正方體</option>
            <option value="pyramid">三角錐</option>
            <option value="cylinder">圓柱體</option>
            <option value="torus">圓環</option>
            <option value="torusKnot">扭結體</option>
        </select>

        <label class="flex items-center gap-1.5 text-xs text-slate-300 font-medium cursor-pointer bg-slate-900/60 px-2.5 py-1.5 rounded-xl border border-slate-800/80 hover:border-slate-700 transition-colors">
            <input type="checkbox" id="toggle-rays" checked class="w-3.5 h-3.5 accent-sky-500 rounded cursor-pointer">
            <span>顯示輔助線</span>
        </label>
    </div>
    <!-- 3D Canvas Viewport -->
    <div id="canvas-container" class="canvas-cursor-grab"></div>

    <script>
        lucide.createIcons();

        const container = document.getElementById('canvas-container');
        
        // --- 1. Scene, Fixed Orthographic-style Perspective Camera & Renderer ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e17);

        // Fixed side-view camera (Facing XY plane, Z axis is depth)
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        // Position camera directly in front of scene looking straight ahead
        camera.position.set(0, 4.5, 18);
        camera.lookAt(0, 4.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- 2. Ambient & Point Lighting Setup ---
        // 調高環境光強度，減少背光暗部的死黑對比
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambientLight);

        // 新增來自前鏡頭方向的柔和補光，提升物件正面質感與清晰度
        const fillLight = new THREE.DirectionalLight(0xe0f2fe, 0.35);
        fillLight.position.set(0, 5, 10);
        scene.add(fillLight);

        // Point Light located low on the left side
        const lightPos = new THREE.Vector3(-6.5, 1.2, 0);
        const pointLight = new THREE.PointLight(0xffdf9e, 2.8, 35);
        pointLight.position.copy(lightPos);
        pointLight.castShadow = true;

        // Shadow quality settings (調整貼圖解析度使 Sample Radius 的模糊感更為顯著)
        pointLight.shadow.mapSize.width = 1024;
        pointLight.shadow.mapSize.height = 1024;
        pointLight.shadow.camera.near = 0.2;
        pointLight.shadow.camera.far = 30;
        pointLight.shadow.bias = -0.001;
        pointLight.shadow.radius = 1; // 初始陰影柔化半徑
        scene.add(pointLight);

        // Point Light Visual Bulb
        const lightMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.22, 24, 24),
            new THREE.MeshBasicMaterial({ color: 0xffaa00 })
        );
        lightMesh.position.copy(lightPos);
        scene.add(lightMesh);

        // Glowing lamp stand on ground
        const standMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.5, 1.2, 16),
            new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 })
        );
        standMesh.position.set(-6.5, 0.6, 0);
        scene.add(standMesh);

        // --- 3. Floor & Right Wall (Projection Screen) ---
        // Floor
        const floorGeo = new THREE.BoxGeometry(20, 0.2, 10);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.set(0, -0.1, 0);
        floor.receiveShadow = true;
        scene.add(floor);

        // Floor Grid Lines
        const grid = new THREE.GridHelper(20, 20, 0x38bdf8, 0x1e293b);
        grid.position.set(0, 0.01, 0);
        scene.add(grid);

        // Right Wall (Projection Screen receiving the shadow)
        const wallX = 6.5;
        const wallGeo = new THREE.BoxGeometry(0.3, 10, 10);
        const wallMat = new THREE.MeshStandardMaterial({ 
            color: 0xf8fafc, 
            roughness: 0.4,
            metalness: 0.05
        });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(wallX + 0.15, 5, 0);
        wall.receiveShadow = true;
        scene.add(wall);

        // Wall Frame accent
        const wallFrameGeo = new THREE.BoxGeometry(0.1, 10.2, 10.2);
        const wallFrameMat = new THREE.MeshBasicMaterial({ color: 0x0284c7 });
        const wallFrame = new THREE.Mesh(wallFrameGeo, wallFrameMat);
        wallFrame.position.set(wallX + 0.35, 5, 0);
        scene.add(wallFrame);

        // --- 4. Interactive Object Setup ---
        // 調整物件材質為更亮麗的天藍色，並降低金屬感以緩和光影對比
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x38bdf8, 
            roughness: 0.4,
            metalness: 0.1
        });

        const geometries = {
            cube: new THREE.BoxGeometry(1.4, 1.4, 1.4),
            pyramid: new THREE.ConeGeometry(1.0, 1.6, 4),
            cylinder: new THREE.CylinderGeometry(0.7, 0.7, 1.6, 24),
            torus: new THREE.TorusGeometry(0.8, 0.28, 20, 40),
            torusKnot: new THREE.TorusKnotGeometry(0.6, 0.2, 80, 16)
        };

        let currentMesh = new THREE.Mesh(geometries.cube, material);
        currentMesh.position.set(-1.0, 3.0, 0);
        currentMesh.castShadow = true;
        currentMesh.receiveShadow = true;
        scene.add(currentMesh);

        // Ray Visualizer Lines (Dashed rays extending from light to object and screen)
        const rayMaterial = new THREE.LineDashedMaterial({
            color: 0xf59e0b,
            dashSize: 0.2,
            gapSize: 0.1,
            linewidth: 2
        });

        const rayGroup = new THREE.Group();
        scene.add(rayGroup);

        function updateProjectionRays() {
            rayGroup.clear();
            if (!document.getElementById('toggle-rays').checked) return;

            // Compute object's world bounding box to find key edges
            const bbox = new THREE.Box3().setFromObject(currentMesh);
            const corners = [
                new THREE.Vector3(bbox.min.x, bbox.max.y, 0), // Top Left
                new THREE.Vector3(bbox.max.x, bbox.max.y, 0), // Top Right
                new THREE.Vector3(bbox.min.x, bbox.min.y, 0), // Bottom Left
                new THREE.Vector3(bbox.max.x, bbox.min.y, 0)  // Bottom Right
            ];

            corners.forEach(corner => {
                // Ray vector from light through corner point to right wall
                const dir = new THREE.Vector3().subVectors(corner, lightPos).normalize();
                if (dir.x <= 0) return;

                const distanceToWall = (wallX - lightPos.x) / dir.x;
                const wallIntersectPoint = new THREE.Vector3().addVectors(
                    lightPos, 
                    dir.clone().multiplyScalar(distanceToWall)
                );

                const points = [lightPos.clone(), wallIntersectPoint];
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geometry, rayMaterial);
                line.computeLineDistances();
                rayGroup.add(line);
            });
        }

        // --- 5. Direct Dragging Interaction (Without Coordinate Axes) ---
        let currentMode = 'translate'; // 'translate' or 'rotate'
        let isDragging = false;
        let dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0); // XY Plane at Z=0
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let planeIntersect = new THREE.Vector3();
        let dragOffset = new THREE.Vector3();
        let lastMouseX = 0;

        function getMouseNDCPos(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            return {
                x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
                y: -((e.clientY - rect.top) / rect.height) * 2 + 1
            };
        }

        function onPointerDown(e) {
            const pos = getMouseNDCPos(e);
            mouse.set(pos.x, pos.y);
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObject(currentMesh);
            if (intersects.length > 0) {
                isDragging = true;
                container.classList.remove('canvas-cursor-grab');
                container.classList.add('canvas-cursor-grabbing');

                if (currentMode === 'translate') {
                    raycaster.ray.intersectPlane(dragPlane, planeIntersect);
                    dragOffset.subVectors(currentMesh.position, planeIntersect);
                } else {
                    lastMouseX = e.clientX;
                }
            }
        }

        function onPointerMove(e) {
            const pos = getMouseNDCPos(e);
            mouse.set(pos.x, pos.y);

            if (isDragging) {
                if (currentMode === 'translate') {
                    raycaster.setFromCamera(mouse, camera);
                    if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                        // Update object position constrained to 2D bounds
                        let newX = planeIntersect.x + dragOffset.x;
                        let newY = planeIntersect.y + dragOffset.y;

                        // Clamp inside reasonable view box (between light and wall, above floor)
                        newX = Math.max(-4.5, Math.min(wallX - 1.2, newX));
                        newY = Math.max(1.0, Math.min(8.0, newY));

                        currentMesh.position.set(newX, newY, 0);
                        updateRealtimeData();
                    }
                } else if (currentMode === 'rotate') {
                    // Rotate object around Y axis based on mouse X motion
                    const deltaX = e.clientX - lastMouseX;
                    currentMesh.rotation.y += deltaX * 0.02;
                    lastMouseX = e.clientX;
                    updateProjectionRays();
                }
            } else {
                // Hover effect check
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(currentMesh);
                if (intersects.length > 0) {
                    currentMesh.material.emissive = new THREE.Color(0x0284c7);
                    currentMesh.material.emissiveIntensity = 0.3;
                } else {
                    currentMesh.material.emissive = new THREE.Color(0x000000);
                    currentMesh.material.emissiveIntensity = 0.0;
                }
            }
        }

        function onPointerUp() {
            isDragging = false;
            container.classList.remove('canvas-cursor-grabbing');
            container.classList.add('canvas-cursor-grab');
        }

        container.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        // --- 6. UI Control Buttons & Event Listeners ---
        const btnTranslate = document.getElementById('btn-translate');
        const btnRotate = document.getElementById('btn-rotate');
        const shapeSelect = document.getElementById('shape-select');

        function setTranslateMode() {
            currentMode = 'translate';
            btnTranslate.className = "flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-sky-600 text-white font-semibold text-sm transition-all duration-200 shadow-lg shadow-sky-600/30";
            btnRotate.className = "flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-medium text-sm transition-all duration-200 border border-slate-700 hover:bg-slate-700";
        }

        function setRotateMode() {
            currentMode = 'rotate';
            btnRotate.className = "flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-sky-600 text-white font-semibold text-sm transition-all duration-200 shadow-lg shadow-sky-600/30";
            btnTranslate.className = "flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-medium text-sm transition-all duration-200 border border-slate-700 hover:bg-slate-700";
        }

        btnTranslate.addEventListener('click', setTranslateMode);
        btnRotate.addEventListener('click', setRotateMode);

        shapeSelect.addEventListener('change', (e) => {
            const shapeKey = e.target.value;
            if (geometries[shapeKey]) {
                const currentRot = currentMesh.rotation.clone();
                const currentPos = currentMesh.position.clone();
                
                scene.remove(currentMesh);
                currentMesh = new THREE.Mesh(geometries[shapeKey], material);
                currentMesh.position.copy(currentPos);
                currentMesh.rotation.copy(currentRot);
                currentMesh.castShadow = true;
                currentMesh.receiveShadow = true;
                scene.add(currentMesh);
                
                updateRealtimeData();
            }
        });

        document.getElementById('toggle-rays').addEventListener('change', updateProjectionRays);

        // --- 7. Shadow calculation ---
        function updateRealtimeData() {
            const d1 = currentMesh.position.x - lightPos.x; // Light to object distance along X
            const d2 = wallX - currentMesh.position.x;       // Object to wall distance along X
            const magnification = (d1 + d2) / Math.max(0.01, d1);

            // 動態計算陰影模糊度 (Shadow Penumbra / Blur Radius)
            // 物件靠近光源 (物距 d1 小、放大率高) -> 模糊半徑大幅擴張 (最高可達 32)
            // 物件遠離光源 (物距 d1 大、靠近牆面) -> 模糊半徑顯著收斂 (降至 0.5 呈現極清晰邊緣)
            const blurRadius = Math.max(0.5, Math.min(32.0, Math.pow(magnification - 1.0, 1.2) * 7.5 + 0.5));
            pointLight.shadow.radius = blurRadius;

            updateProjectionRays();
        }

        // --- 8. Window Resize & Render Loop ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // Initialize scene calculation and animation
        updateRealtimeData();
        animate();
    </script>
</body>
</html>
